name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # NOTE: the real Thermo RawFileReader (fisher_py / .NET) cannot run here,
      # so we install only the test/runtime deps that import on Linux and rely
      # on the mocked reader in tests/. We deliberately do NOT install fisher_py.
      - name: Install package (without fisher_py) + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy pytest ruff
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      - name: Run mocked tests
        run: pytest -v
