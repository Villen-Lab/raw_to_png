[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-to-png"
version = "0.1.0"
description = "Render TIC and base-peak chromatogram PNGs from Thermo .RAW mass-spectrometry files."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Alexis" }]
keywords = ["mass-spectrometry", "proteomics", "thermo", "raw", "chromatogram", "TIC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fisher_py>=2.0",
    "matplotlib>=3.5",
    "numpy>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
raw-to-png = "raw_to_png.cli:main"

[project.urls]
Repository = "https://github.com/alexis-cmyk/raw_to_png"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
